<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>animations</title>
    <style>
      body { margin: 0; padding: 16px; font-family: sans-serif; }
      @keyframes fade-in { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      .fade { animation: fade-in 5s ease-out both; }
      .grower { width: 100px; height: 20px; background: #cde; transition: width 5s linear; }
      .grower.wide { width: 300px; }
      .spinner { width: 40px; height: 40px; background: #333; animation: spin 1s linear infinite; }
      .progress { position: fixed; top: 0; left: 0; width: 100%; height: 4px; background: #06c; transform-origin: 0 0; animation: grow linear both; animation-timeline: scroll(root); }
      .tall { height: 3000px; }
    </style>
  </head>
  <body>
    <div class="progress"></div>
    <h1 class="fade">Fades in</h1>
    <div class="grower"></div>
    <div class="spinner"></div>
    <div class="tall"></div>
    <script>
      requestAnimationFrame(() => requestAnimationFrame(() => document.querySelector('.grower').classList.add('wide')));
    </script>
  </body>
</html>
