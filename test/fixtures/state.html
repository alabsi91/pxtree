<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>state</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: sans-serif;
        font-size: 16px;
      }

      button {
        width: 120px;
        height: 40px;
      }

      .menu {
        display: none;
        margin: 8px 0;
        padding: 8px;
        width: 200px;
        list-style: none;
        background: #f3f4f6;
      }

      .menu.open {
        display: block;
      }

      .menu-item {
        height: 32px;
      }

      .tip-anchor {
        display: inline-block;
        margin-top: 16px;
        padding: 8px;
      }

      .tooltip {
        display: none;
        width: 160px;
        padding: 8px;
        background: #111827;
        color: #ffffff;
      }

      .tip-anchor:hover + .tooltip {
        display: block;
      }

      .late-panel {
        width: 240px;
        height: 60px;
        background: #dbeafe;
      }
    </style>
  </head>
  <body>
    <button id="menu-toggle" type="button">Menu</button>
    <ul class="menu">
      <li class="menu-item">Profile</li>
      <li class="menu-item">Settings</li>
      <li class="menu-item">Sign out</li>
    </ul>

    <span class="tip-anchor">Info</span>
    <div class="tooltip">Helpful tooltip text</div>

    <div><button id="load" type="button">Load</button></div>

    <script>
      document.getElementById('menu-toggle').addEventListener('click', () => {
        document.querySelector('.menu').classList.toggle('open');
      });

      document.getElementById('load').addEventListener('click', () => {
        setTimeout(() => {
          const latePanel = document.createElement('div');
          latePanel.className = 'late-panel';
          latePanel.textContent = 'Loaded later';
          document.body.append(latePanel);
        }, 1500);
      });
    </script>
  </body>
</html>
