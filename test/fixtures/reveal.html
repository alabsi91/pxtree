<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>reveal</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
      section { height: 900px; padding: 24px; box-sizing: border-box; }
      .reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.6s, transform 0.6s; }
      .reveal.visible { opacity: 1; transform: none; }
    </style>
  </head>
  <body>
    <section class="intro"><h1>Top of the page</h1></section>
    <section class="reveal feature-one"><h2>First feature</h2></section>
    <section class="reveal feature-two"><h2>Second feature</h2></section>
    <section class="reveal feature-three"><h2>Third feature</h2></section>
    <script>
      const observer = new IntersectionObserver(
        (entries) => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        },
        { threshold: 0.1 },
      );
      for (const section of document.querySelectorAll('.reveal')) observer.observe(section);
    </script>
  </body>
</html>
