<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>top layer</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
      main { padding: 24px; }
      dialog { width: 480px; padding: 24px; border: 1px solid #ccc; }
      dialog h2 { margin: 0; font-size: 24px; line-height: 32px; }
      #hint { margin: 0; top: 330px; left: 420px; width: 200px; height: 40px; padding: 0; border: 0; background: #ffd; }
    </style>
  </head>
  <body>
    <main>
      <h1>Projects</h1>
      <p>Lots of project rows live behind the dialog.</p>
      <button id="delete">Delete</button>
    </main>
    <dialog id="confirm-delete">
      <h2>Delete project?</h2>
      <p>This removes the project and all of its files.</p>
      <div id="hint" popover="manual">Popover hint</div>
    </dialog>
    <script>
      const dialog = document.getElementById('confirm-delete');
      dialog.showModal();
      const heading = dialog.querySelector('h2').getBoundingClientRect();
      const hint = document.getElementById('hint');
      hint.style.top = heading.top + 'px';
      hint.style.left = heading.left + 'px';
      hint.showPopover();
    </script>
  </body>
</html>
