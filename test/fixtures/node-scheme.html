<!doctype html>
<meta charset="utf-8" />
<title>node scheme</title>
<style>
  body { background: #ffffff; font-family: sans-serif; }
  p { color: #222222; }
  .quiet { color: #333333; }
  @media (prefers-color-scheme: dark) {
    p { color: #eeeeee; }
    .quiet { color: #444444; }
  }
</style>
<body>
  <div class="card"><p>card text</p></div>
  <footer><p class="low">footer text</p></footer>
  <section><p class="quiet">quiet text</p></section>
</body>
