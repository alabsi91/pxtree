<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>images</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        font-family: sans-serif;
        font-size: 16px;
        line-height: 24px;
      }

      img {
        display: block;
        margin-bottom: 16px;
      }

      .toolbar {
        display: flex;
        gap: 4px;
      }

      .icon-link,
      .spaced-link {
        display: block;
        width: 16px;
        height: 16px;
        background: #1f2937;
      }

      .spaced-toolbar {
        padding: 24px;
      }

      .big-label {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 32px;
      }

      .tiny-label {
        font-size: 12px;
        line-height: 14px;
      }
    </style>
  </head>

      width="50"

    <img

    <div class="toolbar">
      <a class="icon-link" href="#settings" aria-label="Settings"></a>
      <a class="icon-link" href="#help" aria-label="Help"></a>
