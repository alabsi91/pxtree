<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>wrap</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        font-size: 16px;
        line-height: 24px;
      }

      aside {
        width: 220px;
        padding: 24px;
      }

      h2 {
        margin: 0 0 16px;
        font-size: 24px;
        line-height: 32px;
      }

      p {
        margin: 0 0 16px;
      }

      .nowrap {
        overflow: hidden;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <aside>
      <h2 class="wrapping">Pricing that grows with your team</h2>
      <p class="address">Main Street 12<br />Springfield, somewhere far away</p>
      <h2 class="nowrap">Pricing that never wraps at all</h2>
    </aside>
  </body>
</html>
