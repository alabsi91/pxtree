<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>truncation edge cases</title>
    <style>
      body { margin: 0; padding: 20px; font-family: sans-serif; font-size: 16px; }
      .ellipsis-visible { width: 50px; white-space: nowrap; text-overflow: ellipsis; background: #eee; margin-bottom: 20px; }
      .scroller { width: 200px; height: 40px; overflow: auto; }
    </style>
  </head>
  <body>
    <p class="ellipsis-visible">long long long text here</p>
    <div class="scroller">line one of scrollable text that keeps going and going and going until it needs to scroll well past forty pixels</div>
  </body>
</html>
