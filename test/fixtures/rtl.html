<!doctype html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8" />
    <title>rtl</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
      main { padding: 16px; }
      .card { width: 358px; padding: 16px; box-sizing: border-box; background: #fff; border: 1px solid #ddd; }
      .more { display: block; width: 372px; white-space: nowrap; font-size: 15px; line-height: 24px; }
      .island { width: 200px; margin-top: 16px; padding: 8px; }
      .island span { display: inline-block; width: 50px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">أحدث المنتجات</h1>
      <div class="card">
        <h3>سماعات لاسلكية</h3>
        <a class="more" href="#">عرض التفاصيل الكاملة</a>
      </div>
      <div class="island" dir="ltr"><span class="first">one</span><span class="second">two</span></div>
    </main>
  </body>
</html>
